name: ci

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest ruff
      - name: Lint (pyflakes + syntax errors, production modules)
        run: ruff check --select F,E9 --exclude ios,companion,docs,tests .
      - name: Python suites
        run: python -m pytest
      - name: Deploy scripts parse
        run: |
          bash -n deploy/redeploy.sh deploy/setup.sh
          python -c "import glob, plistlib; [plistlib.load(open(p, 'rb')) for p in glob.glob('deploy/*.plist')]"
