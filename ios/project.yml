name: SurvivorGame
options:
  bundleIdPrefix: mctech
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: "16.1.0"

# The pbxproj is GENERATED — every target/package/entitlement/signing change
# goes through this file, then `xcodegen generate`. Hand-edits get clobbered.
targets:
  SurvivorGame:
    type: application
    platform: iOS
    sources:
      - SurvivorGame
    resources:
      - path: SurvivorGame/Resources
        buildPhase: resources
      # Apple's required-reason API manifest (user defaults, CA92.1). It is
      # named here as well as swept up by the rule above so that narrowing
      # that rule can never quietly ship a build without a manifest — the
      # flattening puts it at the bundle root, where validation looks.
      - path: SurvivorGame/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: SurvivorGame/App/Info.plist
      properties:
        # The game server speaks plain HTTP on the LAN (TLS terminates at the
        # Cloudflare tunnel). Local networking only — remote stays https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Survivor connects to the game server running on your local network.
        # Networking uses Apple's built-in TLS stack only. Declaring this here
        # prevents every TestFlight upload from stopping for export compliance.
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: mctech.SurvivorGame
            CFBundleURLSchemes: [survivorgame]
        # Bundled Fraunces variable fonts (OFL) — filenames only; the
        # resources phase flattens Resources/Fonts into the bundle root.
        UIAppFonts:
          - Fraunces-Variable.ttf
          - Fraunces-Italic-Variable.ttf
    dependencies:
      - package: SocketIO
        product: SocketIO
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: mctech.SurvivorGame
        DEVELOPMENT_TEAM: M5H3893R7A
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "11"
        SWIFT_STRICT_CONCURRENCY: complete

  SurvivorGameTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SurvivorGameTests
    dependencies:
      - target: SurvivorGame
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: M5H3893R7A
        PRODUCT_BUNDLE_IDENTIFIER: mctech.SurvivorGameTests
        GENERATE_INFOPLIST_FILE: YES

  SurvivorGameUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SurvivorGameUITests
    dependencies:
      - target: SurvivorGame
    settings:
      base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: M5H3893R7A
        PRODUCT_BUNDLE_IDENTIFIER: mctech.SurvivorGameUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SurvivorGame

schemes:
  SurvivorGame:
    build:
      targets:
        SurvivorGame: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SurvivorGameTests
        - SurvivorGameUITests
    archive:
      config: Release
